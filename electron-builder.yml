# Packaging: turns the build in out/ into installers in dist/.
# Docs: https://www.electron.build/configuration
appId: io.github.justartiom.streamy
productName: Streamy
copyright: Copyright © 2026 JustArtiom

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json

# Security switches baked into the Electron binary.
# https://www.electronjs.org/docs/latest/tutorial/fuses
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Flipping fuses breaks the free local signature on Apple Silicon; redo it.
  resetAdHocDarwinSignature: true

# Lets Streamy open magnet: links (macOS Info.plist, Linux .desktop file).
# Windows registers it at runtime when the user turns it on in Settings.
protocols:
  - name: Magnet link
    schemes:
      - magnet
    role: Viewer

# Icons are generated by `npm run icons` (scripts/icons.mjs).
mac:
  # Icon Composer format (macOS 26 "Liquid Glass"). Needs Xcode 26+ to build;
  # it also produces the icon for older macOS versions.
  icon: build/icon.icon
  category: public.app-category.entertainment
  target:
    - dmg
    - zip # auto-update on macOS downloads the zip
  hardenedRuntime: true
  notarize: false # needs an Apple Developer account

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - nsis

nsis:
  artifactName: ${productName}-${version}-setup.${ext}

linux:
  icon: build/icons
  target:
    - AppImage
    - deb
  category: AudioVideo
  maintainer: JustArtiom
  # The window icon (see src/main/icon.ts)
  extraResources:
    - from: build/icons/512x512.png
      to: icon.png

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: JustArtiom
  repo: streamy
