# Packaging: turns the build in out/ into installers in dist/.
# Docs: https://www.electron.build/configuration
appId: io.github.justartiom.streamy
productName: Streamy
copyright: Copyright © 2026 JustArtiom

directories:
  buildResources: build
  output: dist

# What goes into app.asar. electron-builder adds the production
# node_modules (dependencies, not devDependencies) on its own.
files:
  - out/**/*
  - package.json

# Native add-ons can't be loaded from inside app.asar, so they go next to it
# in app.asar.unpacked/. Electron redirects require() there by itself.
asarUnpack:
  - "**/*.node"

# Don't let electron-builder rebuild native add-ons. Ours (node-datachannel,
# utp-native, bufferutil, utf-8-validate, fs-native-extensions) are all N-API
# prebuilds that Electron loads as they are. The rebuild doesn't recognise
# most of their prebuild file names, so it would compile them from source on
# every build, and it rewrites node_modules in place.
npmRebuild: false

# Before packing each platform/arch, make sure vendor/ffmpeg/ holds the
# pinned ffmpeg for it (downloads it if needed; see scripts/fetch-ffmpeg.mjs).
# electron-builder would otherwise only warn about a missing folder.
beforePack: ./scripts/fetch-ffmpeg.mjs

# After unpacking Electron for each platform/arch: write
# vendor/THIRD_PARTY_NOTICES.txt (the licences of everything inside Streamy),
# and on macOS keep Electron's and Chromium's licence files inside the app.
# See scripts/notices.mjs.
afterExtract: ./scripts/notices.mjs

# Shipped on every platform, next to app.asar (resources/). Settings →
# Advanced → "Third-party licences" shows it.
extraResources:
  - from: vendor/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt

# Security switches baked into the Electron binary.
# https://www.electronjs.org/docs/latest/tutorial/fuses
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Flipping fuses breaks the free local signature on Apple Silicon; redo it.
  resetAdHocDarwinSignature: true

# Lets Streamy open magnet: links (macOS Info.plist, Linux .desktop file).
# Windows registers it at runtime when the user turns it on in Settings.
protocols:
  - name: Magnet link
    schemes:
      - magnet
    role: Viewer

# Each platform below copies its ffmpeg + ffprobe to resources/ffmpeg/,
# outside the asar so they can run. The folder names say darwin/win32/linux
# because electron-builder's ${platform} macro is the OS doing the build,
# not the target. ${arch} is the target (x64, arm64).
#
# .torrent files open in Streamy (double-click, "Open with").

# Icons are generated by `npm run icons` (scripts/icons.mjs).
mac:
  # Icon Composer format (macOS 26 "Liquid Glass"). Needs Xcode 26+ to build;
  # it also produces the icon for older macOS versions.
  icon: build/icon.icon
  category: public.app-category.entertainment
  target:
    - dmg
    # What macOS auto-update would download, once the app is signed. Releases
    # don't attach it yet (see .github/workflows/release.yml).
    - zip
  hardenedRuntime: true
  notarize: false # needs an Apple Developer account
  # When signing is turned on, everything under Contents/ is signed,
  # resources/ffmpeg included; no `binaries` list needed.
  extraResources:
    - from: vendor/ffmpeg/darwin-${arch}
      to: ffmpeg
      filter: [ffmpeg, ffprobe]
  fileAssociations:
    - ext: torrent
      name: BitTorrent file
      role: Viewer
      # "Default": a normal opener of .torrent files. Not "Owner" (we don't
      # create them), and not "Alternate", which would let any other app that
      # handles torrents win the double-click even after installing Streamy
      # for exactly that. The user's "Open With → Change All" still wins.
      rank: Default
      isPackage: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - nsis
  extraResources:
    - from: vendor/ffmpeg/win32-${arch}
      to: ffmpeg
      filter: [ffmpeg.exe, ffprobe.exe]
  fileAssociations:
    - ext: torrent
      # On Windows `name` is the registry ID (removed again on uninstall), so
      # it must be ours alone; `description` is what Explorer shows.
      name: Streamy.torrent
      description: BitTorrent file

nsis:
  artifactName: ${productName}-${version}-setup.${ext}

linux:
  icon: build/icons
  target:
    - AppImage
    - deb
  category: AudioVideo
  maintainer: JustArtiom
  # The .deb installs streamy.desktop. Electron knows itself by package.json's
  # `desktopName` (the same name): for "Open magnet links with Streamy"
  # (xdg-settings) and for desktops matching windows to the app.
  syncDesktopName: true
  extraResources:
    # The window icon (see src/main/icon.ts)
    - from: build/icons/512x512.png
      to: icon.png
    - from: vendor/ffmpeg/linux-${arch}
      to: ffmpeg
      filter: [ffmpeg, ffprobe]
  fileAssociations:
    - ext: torrent
      name: BitTorrent file
      mimeType: application/x-bittorrent

# No version in the name: an update replaces the file under the same name, so
# "Open at login" and shortcuts to it keep working (electron-updater keeps
# the name of a file without a version in it).
appImage:
  artifactName: ${productName}-${arch}.${ext}

# Where updates come from. electron-builder writes this into the app
# (resources/app-update.yml) for electron-updater, and writes latest.yml /
# latest-linux.yml next to the installers. CI packages with
# `--publish never` and the release workflow uploads the files itself; the
# draft setting is a safety net in case anyone publishes from electron-builder.
publish:
  provider: github
  owner: JustArtiom
  repo: streamy
  releaseType: draft
