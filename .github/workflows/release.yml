name: Release

# Pushing a version tag (v1.2.3) builds Streamy on all three OSes, runs the
# same checks as CI, and puts the installers in a *draft* GitHub Release.
# Nothing is public until someone publishes the draft: see RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

# One run per tag at a time. A second run of the same tag waits, then updates
# the same draft.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default. Only the last job, which writes the release, gets more.
permissions:
  contents: read

# Installing works like CI (see ci.yml): `npm ci --ignore-scripts`, then
# `npm rebuild node-datachannel` where the engine runs.

jobs:
  version:
    name: Tag matches package.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG isn't a version tag like v1.2.3."
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG, but package.json says $version. Use \`npm version <x.y.z>\`: it changes package.json and makes the matching tag."
            exit 1
          fi
          echo "Releasing Streamy $version"

  check:
    name: Types, lint, format, licences
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Every licence inside the app must be known to be fine (scripts/notices.mjs).
      - run: npm run notices -- --strict

  test:
    name: Tests (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild node-datachannel
      # The real-ffmpeg tests run too (see ci.yml).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/ffmpeg
          key: ffmpeg-own-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - run: npm run ffmpeg
      - run: npm test

  # The same build as CI's (ci.yml), smoke test included. These jobs only
  # read: they run third-party code (npm packages, downloads), so they never
  # get a token that can write.
  build:
    name: Build (${{ matrix.name }})
    needs: [check, test]
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-26
          - name: Windows
            os: windows-2025
            args: --win --x64
          - name: Linux
            os: ubuntu-24.04
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      # No paid code-signing certificate: build unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild node-datachannel

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - name: Fetch ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm run ffmpeg -- --arch arm64
            npm run ffmpeg -- --arch x64
          else
            npm run ffmpeg
          fi

      - run: npm run build

      # `--publish never`: the publish job below uploads, once every build
      # has passed its smoke test. electron-builder still writes the
      # updater's latest.yml / latest-linux.yml next to the installers.
      - name: Package
        if: runner.os != 'macOS'
        run: npx electron-builder ${{ matrix.args }} --publish never
      # Both Mac CPUs on one runner, like CI: the WebRTC add-on is swapped for
      # its x64 prebuild before the Intel pass.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npx electron-builder --mac --arm64 --publish never
          (cd node_modules/node-datachannel && node ../prebuild-install/bin.js -r napi --platform darwin --arch x64)
          npx electron-builder --mac --x64 --publish never

      - name: Smoke test
        shell: bash
        timeout-minutes: 5
        env:
          STREAMY_SMOKE: "1"
        run: |
          profile="$RUNNER_TEMP/streamy-smoke-profile"
          case "$RUNNER_OS" in
            macOS)
              if [ "$RUNNER_ARCH" = "ARM64" ]; then dir=mac-arm64; else dir=mac; fi
              "dist/$dir/Streamy.app/Contents/MacOS/Streamy" --user-data-dir="$profile"
              ;;
            Windows)
              dist/win-unpacked/Streamy.exe --user-data-dir="$profile"
              ;;
            Linux)
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              xvfb-run --auto-servernum dist/linux-unpacked/streamy --user-data-dir="$profile"
              ;;
          esac
      - name: Logs from the smoke test
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP"/streamy-smoke-profile/logs/*.log || true

      # What the release gets. macOS: only the .dmg files. The .zip and
      # latest-mac.yml are for auto-update, which needs a signed app; the two
      # Mac passes would also each write a latest-mac.yml for one CPU only.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/latest.yml
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    # The only job that can write: it creates the draft and uploads to it.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # Stop before touching the release if anything is missing. The updater
      # files must describe this version, or installed copies would never
      # see it.
      - name: Check the files
        shell: bash
        run: |
          version="${TAG#v}"
          cd dist
          for file in \
            "Streamy-$version-arm64.dmg" \
            "Streamy-$version-x64.dmg" \
            "Streamy-$version-setup.exe" \
            "Streamy-$version-setup.exe.blockmap" \
            latest.yml \
            latest-linux.yml; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              exit 1
            fi
          done
          if ! compgen -G "*.AppImage" > /dev/null || ! compgen -G "*.deb" > /dev/null; then
            echo "::error::The Linux packages are missing"
            exit 1
          fi
          for file in latest.yml latest-linux.yml; do
            if ! grep -qx "version: $version" "$file"; then
              echo "::error::$file isn't for version $version"
              exit 1
            fi
          done
          ls -l

      # ffmpeg is GPL: its exact source goes next to the binaries that
      # contain it, so it stays available as long as this release does.
      - name: Attach ffmpeg's source code
        shell: bash
        run: |
          url=$(jq -r .sourceUrl scripts/ffmpeg.json)
          name=$(node scripts/release-notes.mjs --source-asset)
          curl --fail --location --retry 3 --silent --show-error --output "dist/$name" "$url"
          gzip --test "dist/$name"
          ls -l "dist/$name"

      - name: Write the release notes
        run: node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"

      # A new draft, or new files for the draft of an earlier run (its notes
      # are left alone, in case they were edited). A published release is
      # never changed: that version is out, so make a new one. A tag with a
      # hyphen (v1.2.0-beta.1) is a pre-release: GitHub doesn't call it
      # "Latest", and installed copies don't update to it.
      - name: Create or update the draft
        shell: bash
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::$TAG is already published. Make a new version instead."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --draft \
              "${prerelease[@]}" \
              --verify-tag \
              --title "Streamy ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          echo "### Draft ready: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
